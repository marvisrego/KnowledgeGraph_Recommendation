        const grid = document.getElementById('graph-grid');
        const typeColor = (nodeType) => {

            if (key === 'role') return getComputedStyle(document.documentElement).getPropertyValue('--role').trim();
            if (key === 'jobposting') return getComputedStyle(document.documentElement).getPropertyValue('--posting').trim();

            return getComputedStyle(document.documentElement).getPropertyValue('--other').trim();
        };
        for (const payload of graphPayloads) {
            const panel = document.createElement('article');
            panel.className = 'panel';
            const graphId = `graph-${payload.graph_name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
            panel.innerHTML = `
                <div class="panel-head">
                    <div><h2>${payload.graph_name}</h2></div>

                    <span class="other">Other</span>
                </div>`;
